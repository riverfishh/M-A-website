<!doctype html><html lang="en"><head><title>Research Papers – Nova M&A Club</title><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="assets/logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=3"></head><body data-page="papers"><header id="hdr"></header><main>
<section class="wrap"><p class="eyebrow">Library</p><h1>Research Papers</h1><div id="list" class="grid"></div></section>
</main><footer id="ftr"></footer><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script><script src="config.js"></script><script src="common.js"></script>
<script>(async()=>{const el=$("#list");
if(!sb){el.innerHTML='<div class="err">Backend not configured (see config.js).</div>';return}
const {data,error}=await sb.from("papers").select("*").order("created_at",{ascending:false});
if(error){el.innerHTML='<div class="err">Could not load papers. Please try again later.</div>';return}
if(!data.length){el.innerHTML='<div class="empty" style="grid-column:1/-1">No research papers have been published yet.</div>';return}
el.innerHTML=data.map(p=>`<article class="card" style="display:flex;flex-direction:column"><h3>${esc(p.title)}</h3><p class="meta">${[p.category,p.author,p.published_on].filter(Boolean).map(esc).join(" · ")}</p><p style="flex:1;margin:10px 0 18px">${esc(p.summary)}</p><a class="btn" href="${pub("papers",p.file_path)}" download="${esc(p.file_name)}" target="_blank" rel="noopener">Download</a></article>`).join("")})()</script></body></html>
